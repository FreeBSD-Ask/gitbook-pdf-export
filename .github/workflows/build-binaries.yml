name: Build binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 把本次构建发布到该 tag（留空只构建）
        required: false
  push:
    branches:
      - main
    tags:
      - '[0-9]*'
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Build on ${{ matrix.display_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            display_name: Ubuntu 26.04 (x64)
            artifact_name: mdconv-ubuntu-x64
            binary_name: mdconv
          - os: ubuntu-26.04-arm
            display_name: Ubuntu 26.04 (arm64)
            artifact_name: mdconv-ubuntu-arm64
            binary_name: mdconv
          - os: windows-latest
            display_name: Windows (x64)
            artifact_name: mdconv-windows-x64
            binary_name: mdconv.exe
          - os: windows-11-arm
            display_name: Windows (arm64)
            artifact_name: mdconv-windows-arm64
            binary_name: mdconv.exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install LaTeX (Ubuntu only, for formula smoke check)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-chinese fonts-wqy-microhei

      # WeasyPrint 需要系统 pango/gdk-pixbuf；装齐后各平台都能真实渲染 PDF
      - name: Install WeasyPrint runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0

      - name: Install WeasyPrint runtime (Windows x64)
        # Windows arm64 无 GTK 构建，该平台只验证 CLI 与 HTML 导出
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'gtk3-runtime.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/download/2022-01-04/gtk3-runtime-3.24.31-2022-01-04-ts-win64.exe' -OutFile $exe
          Start-Process -Wait -FilePath $exe -ArgumentList '/S'
          $gtkBin = 'C:\Program Files\GTK3-Runtime Win64\bin'
          if (-not (Test-Path $gtkBin)) { throw 'GTK runtime 安装失败' }
          $gtkBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build executable
        run: |
          pyinstaller --clean --onefile mdconv.py

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/mdconv.exe "release/${{ matrix.artifact_name }}.exe"
          else
            cp dist/mdconv "release/${{ matrix.artifact_name }}"
            chmod +x "release/${{ matrix.artifact_name }}"
          fi

      - name: Smoke test binary
        shell: bash
        run: |
          set -uo pipefail
          bin="release/${{ matrix.artifact_name }}"
          # Windows 产物带 .exe 后缀（注意 set -e 下不能写成 && 短路）
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bin="$bin.exe"
          fi
          echo "平台: RUNNER_OS=$RUNNER_OS RUNNER_ARCH=${RUNNER_ARCH:-未设置}"
          if ! "$bin" -h > help.out 2>&1; then
            echo "二进制无法执行，输出如下："
            cat help.out
            exit 1
          fi
          mkdir -p smoke-src
          printf '# Summary\n\n* [A](a.md)\n' > smoke-src/SUMMARY.md
          printf '# 冒烟\n\n正文。\n' > smoke-src/a.md
          # 按 GTK 是否可用决定能否渲染 PDF：Windows arm64 没有对应构建，
          # 该平台只验证 CLI 与 HTML 导出
          render=1
          if [[ "$RUNNER_OS" == "Windows" ]] && [ ! -d "C:/Program Files/GTK3-Runtime Win64/bin" ]; then
            render=0
          fi
          if [ "$render" -eq 1 ]; then
            # 真实导出三格式：PDF 版本必须为 2.0，EPUB/DOCX 必须是 zip 容器
            "$bin" smoke-src -o smoke-out --no-formula
            python -c "import sys; bad=[p for p,m in (('smoke-out/final.pdf',b'%PDF-2.0'),('smoke-out/final.epub',b'PK'),('smoke-out/final.docx',b'PK')) if open(p,'rb').read(len(m))!=m]; sys.exit('开头不符合预期: '+str(bad) if bad else 0)"
          else
            echo "未检测到 GTK runtime，验证 CLI、HTML、EPUB 与 DOCX（跳过 PDF）"
            "$bin" smoke-src -o smoke-out --no-pdf --no-formula
            test -s smoke-out/final.html
            python -c "import sys; bad=[p for p,m in (('smoke-out/final.epub',b'PK'),('smoke-out/final.docx',b'PK')) if open(p,'rb').read(len(m))!=m]; sys.exit('开头不符合预期: '+str(bad) if bad else 0)"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*

  freebsd:
    name: Build on FreeBSD 15.1 (ZFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.6.0
        with:
          # 带 -zfs 后缀的 release 使用上游 ZFS 根分区镜像（见 action 的 release 表）
          release: '15.1-zfs'
          usesh: true
          run: |
            # latest 源：quarterly 冻结分支的包集合落后于 ports
            sed -i '' 's/quarterly/latest/g' /etc/pkg/FreeBSD.conf
            pkg update -f
            # latest 只提供 python315 解释器与 py315-{setuptools,wheel,...} 构建工具，
            # 第三方端口（weasyprint/pyinstaller/pillow/python-docx）仅有 py312 版本，
            # 而从源码编译 Pillow/PyInstaller 在 CI 内不现实，故依赖取 py312 系列
            pkg install -y py312-pip py312-mistune py312-pygments py312-beautifulsoup4 py312-pyinstaller py312-weasyprint py312-pillow py312-python-docx
            python3.12 -m pip install --break-system-packages EbookLib pypdf
            set -euo pipefail
            python3.12 -m unittest discover -s tests -v || true
            python3.12 -m PyInstaller --clean --onefile mdconv.py
            # 在本平台实际运行产物：FreeBSD 有 pango，完整导出三格式
            ./dist/mdconv -h > /dev/null
            mkdir -p smoke-src
            printf '# Summary\n\n* [A](a.md)\n' > smoke-src/SUMMARY.md
            printf '# 冒烟\n\n正文。\n' > smoke-src/a.md
            ./dist/mdconv smoke-src -o smoke-out --no-formula
            python3.12 -c "import sys; bad=[p for p,m in (('smoke-out/final.pdf',b'%PDF-2.0'),('smoke-out/final.epub',b'PK'),('smoke-out/final.docx',b'PK')) if open(p,'rb').read(len(m))!=m]; sys.exit('开头不符合预期: '+str(bad) if bad else 0)"
            tar czf mdconv-freebsd.tar.gz -C dist mdconv

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdconv-freebsd
          path: mdconv-freebsd.tar.gz

  openbsd:
    name: Smoke test on OpenBSD
    runs-on: ubuntu-latest
    # 无预编译的 lxml/Pillow，pip 需现场编译；镜像缺开发头文件时失败不阻塞发布
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Smoke test inside OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add python3 py3-pip pango py3-cairoscheme libxml libxslt
            python3 -m pip install --upgrade pip --break-system-packages
          run: |
            set -euo pipefail
            python3 -m pip install --break-system-packages -r requirements.txt pypdf
            python3 -m unittest discover -s tests -v

  netbsd:
    name: Smoke test on NetBSD
    runs-on: ubuntu-latest
    # VM 镜像未带 X11 库，pango 依赖的 cairo 装不上；该平台仅作参考，不阻塞发布
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Smoke test inside NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add python312 py312-pip pango
            python3.12 -m pip install --upgrade pip --break-system-packages
          run: |
            set -euo pipefail
            python3.12 -m pip install --break-system-packages -r requirements.txt pypdf
            python3.12 -m unittest discover -s tests -v

  sample-smoke:
    name: Export FreeBSD-Ask sample
    runs-on: ubuntu-26.04
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-chinese fonts-wqy-microhei
          python -m pip install --upgrade pip
          pip install -r requirements.txt pypdf

      - name: Fetch FreeBSD-Ask sample repository
        run: |
          git clone --depth 1 https://github.com/FreeBSD-Ask/FreeBSD-Ask.git sample

      - name: Export PDF / EPUB / DOCX
        run: |
          python mdconv.py sample -o build-sample

      - name: Upload exported books
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-ask-export
          path: |
            build-sample/final.pdf
            build-sample/final.epub
            build-sample/final.docx

  release:
    name: Publish release
    # 推送 tag 或手动指定 release_tag 时，把本次构建的二进制发布到 Release；
    # 所有平台构建并通过本机冒烟测试后才发布（macOS 已放弃支持）
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') }}
    needs:
      - freebsd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Wait for platform builds and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # 等各平台构建与其冒烟测试结束
          while :; do
            jobs=$(gh api "$api/jobs" --jq \
              '[.jobs[] | select(.name | startswith("Build on ")) | {name, c: (.conclusion // .status)}]')
            echo "$jobs" | jq -r '.[] | "\(.name): \(.c)"'
            pending=$(echo "$jobs" | jq '[.[] | select(.c == "queued" or .c == "in_progress")] | length')
            count=$(gh api "$api/artifacts" --jq \
              '[.artifacts[] | select(.name | startswith("mdconv-"))] | length')
            echo "二进制 artifact: $count"
            if [ "$pending" -eq 0 ]; then break; fi
            sleep 30
          done
          failed=$(echo "$jobs" | jq -r '[.[] | select(.c != "success")] | length')
          if [ "$failed" -ne 0 ]; then
            echo "有平台未通过构建或运行测试，取消发布："
            echo "$jobs" | jq -r '.[] | select(.c != "success") | "  \(.name): \(.c)"'
            exit 1
          fi
          if [ "$count" -lt 5 ]; then
            echo "产物不足（$count 个），取消发布"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          files=$(find dist -type f -name 'mdconv*' | sort)
          echo "$files"
          test -n "$files"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber -R "$GITHUB_REPOSITORY"
          else
            # tag 已由推送建立，不能再传 --target（会尝试重建同名 tag 而失败）
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" $files --title "$TAG" --generate-notes
          fi
