name: Build binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Build on ${{ matrix.display_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            display_name: Ubuntu 26.04 (x64)
            artifact_name: mdconv-ubuntu-x64
            binary_name: mdconv
          - os: ubuntu-26.04-arm
            display_name: Ubuntu 26.04 (arm64)
            artifact_name: mdconv-ubuntu-arm64
            binary_name: mdconv
          - os: windows-latest
            display_name: Windows (x64)
            artifact_name: mdconv-windows-x64
            binary_name: mdconv.exe
          - os: windows-11-arm
            display_name: Windows (arm64)
            artifact_name: mdconv-windows-arm64
            binary_name: mdconv.exe
          - os: macos-15-arm64
            display_name: macOS (arm64)
            artifact_name: mdconv-macos-arm64
            binary_name: mdconv
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install LaTeX (Ubuntu only, for formula smoke check)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-chinese fonts-wqy-microhei

      - name: Build executable
        run: |
          pyinstaller --clean --onefile mdconv.py

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/mdconv.exe "release/${{ matrix.artifact_name }}.exe"
          else
            cp dist/mdconv "release/${{ matrix.artifact_name }}"
            chmod +x "release/${{ matrix.artifact_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*

  freebsd:
    name: Build on FreeBSD 15.1 (ZFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.6.0
        with:
          # 带 -zfs 后缀的 release 使用上游 ZFS 根分区镜像（见 action 的 release 表）
          release: '15.1-zfs'
          usesh: true
          run: |
            # latest 源：quarterly 冻结分支的包集合落后于 ports
            sed -i '' 's/quarterly/latest/g' /etc/pkg/FreeBSD.conf
            pkg update -f
            # latest 只提供 python315 解释器与 py315-{setuptools,wheel,...} 构建工具，
            # 第三方端口（weasyprint/pyinstaller/pillow/python-docx）仅有 py312 版本，
            # 而从源码编译 Pillow/PyInstaller 在 CI 内不现实，故依赖取 py312 系列
            pkg install -y py312-pip py312-mistune py312-pygments py312-beautifulsoup4 py312-pyinstaller py312-weasyprint py312-pillow py312-python-docx
            python3.12 -m pip install --break-system-packages EbookLib pypdf
            set -euo pipefail
            python3.12 -m unittest discover -s tests -v || true
            python3.12 -m PyInstaller --clean --onefile mdconv.py
            tar czf mdconv-freebsd.tar.gz -C dist mdconv

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdconv-freebsd
          path: mdconv-freebsd.tar.gz

  openbsd:
    name: Smoke test on OpenBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Smoke test inside OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add python3 py3-pip pango py3-cairoscheme
            python3 -m pip install --upgrade pip --break-system-packages
          run: |
            set -euo pipefail
            python3 -m pip install --break-system-packages -r requirements.txt pypdf
            python3 -m unittest discover -s tests -v

  netbsd:
    name: Smoke test on NetBSD
    runs-on: ubuntu-latest
    # VM 镜像未带 X11 库，pango 依赖的 cairo 装不上；该平台仅作参考，不阻塞发布
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Smoke test inside NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add python312 py312-pip pango
            python3.12 -m pip install --upgrade pip --break-system-packages
          run: |
            set -euo pipefail
            python3.12 -m pip install --break-system-packages -r requirements.txt pypdf
            python3.12 -m unittest discover -s tests -v

  sample-smoke:
    name: Export FreeBSD-Ask sample
    runs-on: ubuntu-26.04
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-chinese fonts-wqy-microhei
          python -m pip install --upgrade pip
          pip install -r requirements.txt pypdf

      - name: Fetch FreeBSD-Ask sample repository
        run: |
          git clone --depth 1 https://github.com/FreeBSD-Ask/FreeBSD-Ask.git sample

      - name: Export PDF / EPUB / DOCX
        run: |
          python mdconv.py sample -o build-sample

      - name: Upload exported books
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-ask-export
          path: |
            build-sample/final.pdf
            build-sample/final.epub
            build-sample/final.docx
